<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IdeaWorth Admin Login</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06111c;color:#eef5f9;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.box{width:min(420px,calc(100% - 32px));padding:30px;border:1px solid rgba(255,255,255,.09);border-radius:22px;background:#0a1c2b;box-shadow:0 25px 80px rgba(0,0,0,.3)}h1{margin:8px 0;font-size:30px}.eyebrow{color:#39e7af;font-size:11px;font-weight:800;letter-spacing:1.5px}p{color:#8998a7;line-height:1.6;font-size:13px}input{width:100%;padding:14px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:#06131f;color:#fff;margin:10px 0 14px;box-sizing:border-box}button{width:100%;padding:14px;border:0;border-radius:11px;background:#39e7af;color:#04120d;font-weight:800;cursor:pointer}#err{color:#ff9a9a;font-size:12px;min-height:18px;margin-top:12px}</style></head><body><main class="box"><div class="eyebrow">PRIVATE AREA</div><h1>IdeaWorth Admin</h1><p>Enter your admin password to open the single control center.</p><form id="f"><input id="p" type="password" autocomplete="current-password" placeholder="Admin password" required><button>Enter control center →</button></form><div id="err"></div></main><script>
(async()=>{const r=await fetch("/api/admin-login");if(r.ok)location.href="/admin.html";})();
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/admin-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("p").value})});if(r.ok)location.href="/admin.html";else document.getElementById("err").textContent=r.status===503?"Admin password is not configured yet.":"Incorrect password.";};
</script></body></html>
